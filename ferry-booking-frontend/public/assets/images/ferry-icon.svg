<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ferry hull -->
  <rect x="20" y="60" width="60" height="15" rx="2" fill="#1a237e"/>
  
  <!-- Upper deck -->
  <rect x="25" y="45" width="50" height="15" rx="2" fill="#283593"/>
  
  <!-- Bridge/superstructure -->
  <rect x="35" y="30" width="30" height="15" rx="2" fill="#ff9800"/>
  
  <!-- Windows -->
  <circle cx="40" cy="37" r="2" fill="white"/>
  <circle cx="48" cy="37" r="2" fill="white"/>
  <circle cx="56" cy="37" r="2" fill="white"/>
  
  <!-- Deck rails -->
  <line x1="25" y1="45" x2="75" y2="45" stroke="white" stroke-width="1"/>
  <line x1="20" y1="60" x2="80" y2="60" stroke="white" stroke-width="1"/>
  
  <!-- Wake/ water effect -->
  <path d="M15 75 Q25 70 35 75 Q45 80 55 75 Q65 70 75 75 Q85 80 95 75" 
        stroke="#4fc3f7" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Waves -->
  <path d="M10 85 Q20 80 30 85 Q40 90 50 85 Q60 80 70 85 Q80 90 90 85" 
        stroke="#4fc3f7" stroke-width="1" fill="none" opacity="0.4"/>
</svg>